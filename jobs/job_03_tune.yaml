# Submit from the repo root, from a workspace or from your laptop:
#   anyscale job submit -f jobs/job_03_tune.yaml --working-dir . --wait
# Docs: https://docs.anyscale.com/jobs
name: tune-03
entrypoint: python src/tune_ray_train.py
working_dir: .                     # uploaded to the cluster; entrypoint paths are relative to it
excludes:
  - .git
  - notebooks
  - data
  - "**/__pycache__"
  - "**/.ipynb_checkpoints"
image_uri: anyscale/image/pytorch-to-ray-train:1   # built from ./containerfile, see notebook 00
compute_config: gpu-multinode-dev                    # CPU head + single-GPU workers; use a name on your cloud
env_vars:
  NUM_WORKERS: "2"
  USE_GPU: "1"
  NUM_EPOCHS: "2"
  # artifact:// resolves to $ANYSCALE_ARTIFACT_STORAGE/... inside the job cluster, so the
  # checkpoints outlive the cluster. EXPERIMENT_NAME only pins the experiment name and its
  # output directory under STORAGE_PATH; it does NOT resume an interrupted sweep. This script
  # always builds a fresh ray.tune.Tuner(...), never Tuner.restore(), so a rerun with the same
  # EXPERIMENT_NAME starts a new sweep, not a continuation of the old one.
  STORAGE_PATH: "artifact://pytorch-to-ray-train/jobs"
  # Same reasoning as job_02_ray_train.yaml: the 60s default assumes warm workers, and this
  # compute config scales GPU workers up from zero.
  RAY_TRAIN_WORKER_GROUP_START_TIMEOUT_S: "1800"
  # Peak GPU demand = MAX_CONCURRENT_TRIALS x NUM_WORKERS = 2 x 2 = 4.
  NUM_SAMPLES: "4"
  MAX_CONCURRENT_TRIALS: "2"
max_retries: 1                     # Anyscale restarts the whole job once if the driver dies
