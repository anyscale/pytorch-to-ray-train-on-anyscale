# The shape used to validate this repo on AWS: a CPU head node and up to four
# single-L4 GPU workers. Register it once:
#   anyscale compute-config create -f jobs/compute_config.aws-l4.yaml -n l4-multinode-dev
# Docs: https://docs.anyscale.com/configuration/compute
#
# The head node has no GPU, on purpose. The head runs the driver, the dashboard
# and cluster bookkeeping; an accelerator there would sit idle most of the time.
# GPUs live on worker groups that scale to zero when nothing needs them. Ray Tune
# driver processes also land on the head, which is where you want them: they
# survive worker preemption and handle the retries.
cloud: aws-public-us-west-2
head_node:
  instance_type: m5.2xlarge      # 8 vCPU, 32 GB, no GPU
worker_nodes:
  - instance_type: g6.xlarge     # 4 vCPU, 16 GB, 1x NVIDIA L4
    min_nodes: 0                 # scales to zero when idle
    max_nodes: 4
    market_type: ON_DEMAND       # or PREFER_SPOT for cheaper, preemptible workers
enable_cross_zone_scaling: true  # look in every zone of the region for capacity
