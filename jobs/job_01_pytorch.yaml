# Submit from the repo root, from a workspace or from your laptop:
#   anyscale job submit -f jobs/job_01_pytorch.yaml --working-dir . --wait
# Docs: https://docs.anyscale.com/jobs
name: pytorch-01
entrypoint: python src/train_torch.py
working_dir: .                     # uploaded to the cluster; entrypoint paths are relative to it
excludes:
  - .git
  - notebooks
  - data
  - "**/__pycache__"
  - "**/.ipynb_checkpoints"
image_uri: anyscale/image/pytorch-to-ray-train:1   # built from ./containerfile, see notebook 00
compute_config: l4-multinode-dev                    # CPU head + L4 workers; use a name on your cloud
env_vars:
  NUM_WORKERS: "2"
  USE_GPU: "1"
  NUM_EPOCHS: "2"
  # artifact:// resolves to $ANYSCALE_ARTIFACT_STORAGE/... inside the job cluster, so the
  # checkpoints outlive the cluster. This script does not resume: every run writes to a new
  # timestamped subdirectory under STORAGE_PATH, retried or not.
  STORAGE_PATH: "artifact://pytorch-to-ray-train/jobs"
max_retries: 1                     # Anyscale restarts the whole job once if the driver dies
